name: Release

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: read

concurrency:
  group: container-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    permissions:
      contents: write
      packages: write
    env:
      TEST_IMAGE: t3-release:test
      VERSION: ${{ github.ref_name }}
    steps:
      - name: Check out release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare image tags and release notes
        id: release
        shell: bash
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo 'Use a stable version tag such as v1 or v1.2.3.' >&2
            exit 1
          fi
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "image=$image"
            echo 'tags<<EOF'
            echo "$image:$VERSION"
            echo "$image:latest"
            if [[ "$VERSION" == *.* ]]; then echo "$image:${VERSION%%.*}"; fi
            echo EOF
          } >> "$GITHUB_OUTPUT"
          awk -v heading="## [$VERSION]" '
            index($0, heading) == 1 { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/release-notes.md"; then
            echo "Add a CHANGELOG.md entry for $VERSION before tagging." >&2
            exit 1
          fi

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build candidate
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.TEST_IMAGE }}

      - name: Provision SDKs and harnesses
        run: |
          docker run --rm --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --mount type=volume,src=release-home,dst=/home/node \
            --mount type=volume,src=release-tools,dst=/opt/tools \
            --mount type=volume,src=release-scratch,dst=/tmp \
            "$TEST_IMAGE" --version

      - name: Test without network access
        run: |
          docker run --rm --init --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true --memory 6g --cpus 2 \
            --pids-limit 4096 --shm-size 512m --ulimit nofile=65536:65536 \
            --mount type=volume,src=release-home,dst=/home/node \
            --mount type=volume,src=release-tools,dst=/opt/tools \
            --mount type=volume,src=release-scratch,dst=/tmp \
            --mount type=bind,src="$GITHUB_WORKSPACE",dst=/repo,readonly \
            --entrypoint bash "$TEST_IMAGE" -c \
            'node --test /repo/tests/*.test.cjs && bash /repo/tests/smoke.sh'

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.release.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.release.outputs.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          printf '\nContainer image: %s:%s\n\nDigest: %s\n' \
            "$IMAGE" "$VERSION" "$DIGEST" >> "$RUNNER_TEMP/release-notes.md"
          gh release create "$VERSION" --verify-tag --title "$VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
