name: t3-homelab

services:
  t3:
    hostname: ${T3_HOSTNAME:-t3-homelab}
    build:
      context: .
      args:
        NODE_IMAGE:
        DOCKER_CLI_IMAGE:
    init: true
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 60s
    pids_limit: ${T3_PIDS_LIMIT:-4096}
    cpus: ${T3_CPUS:-4}
    mem_limit: ${T3_MEMORY:-8g}
    memswap_limit: ${T3_MEMORY:-8g}
    shm_size: ${T3_SHM_SIZE:-512m}
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    environment:
      T3CODE_HOST: "127.0.0.1"
      T3CODE_PORT: "3773"
      T3CODE_LOG_LEVEL: ${T3_LOG_LEVEL:-Info}
      T3CODE_TELEMETRY_ENABLED: "false"
      T3CODE_SERVER_BROWSER_SANDBOX: "0"
      GH_HOST: github.com
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      # Avoid each concurrent build spawning one worker per host CPU by default.
      CMAKE_BUILD_PARALLEL_LEVEL: ${T3_BUILD_JOBS:-2}
      MAKEFLAGS: -j${T3_BUILD_JOBS:-2}
    volumes:
      - type: bind
        source: ${T3_WORKSPACE_DIR:?Set T3_WORKSPACE_DIR to an existing absolute host directory}
        target: /workspace
        bind:
          create_host_path: false
      - type: volume
        source: agent-home
        target: /home/node
      - type: volume
        source: agent-tools
        target: /opt/tools
      - type: volume
        source: scratch
        target: /tmp
    networks: [egress]
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --output
        - /dev/null
        - --max-time
        - "4"
        - http://127.0.0.1:3773/
      interval: 30s
      timeout: 5s
      start_period: ${T3_START_PERIOD:-15m}
      retries: 3
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  agent-home:
  agent-tools:
  scratch:

networks:
  egress:
    driver: bridge
